# Builds the app and deploys it to GitHub Pages (ADR-0009).
# Reusable: the nightly refresh calls this directly after it commits fresh
# data (ADR-0020) — no workflow_run chaining, no SHA gate.
#
# Requires repo Settings → Pages → Source = "GitHub Actions" (set by hand).
name: Deploy

on:
  push:
    branches: [main]
    # Docs never reach dist — skip the runner entirely for docs-only pushes.
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel an in-flight one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Single job: build and publish share a runner, so we don't pay a second
  # runner's start-up just to hand the artifact over.
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm ci
      # Cheapest check first: a failing step ends the job, so a red build
      # never reaches the publish step.
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
