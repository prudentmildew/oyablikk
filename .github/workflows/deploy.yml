# Builds the app and deploys it to GitHub Pages (ADR-0009).
# Reusable: the nightly refresh calls this directly after it commits fresh
# data (ADR-0020) — no workflow_run chaining, no SHA gate.
#
# Requires repo Settings → Pages → Source = "GitHub Actions" (set by hand).
name: Deploy

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel an in-flight one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
