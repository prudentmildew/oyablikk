<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Øyablikk — Øya Festivalen 2026 schedule</title>
    <meta
      name="description"
      content="Who's on right now, on which stage? A mobile schedule for Øya Festivalen 2026 in Tøyenparken, Oslo, 12–15 August."
    />
    <meta name="theme-color" content="#000000" />
    <!-- No analytics snippet here by design (ADR-0016): Cloudflare Web
         Analytics is configured at the edge, so the beacon is injected by the
         proxy or not at all — never maintained in this file. The service
         worker is registered from main.ts (ADR-0013). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- OG URLs are absolute by spec; they move with the custom domain
         (ADR-0015, PRD §10.1). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Øyablikk — Øya Festivalen 2026 schedule" />
    <meta
      property="og:description"
      content="Who's on right now, on which stage? A mobile schedule for Øya Festivalen 2026 in Tøyenparken, Oslo, 12–15 August."
    />
    <meta property="og:url" content="https://oyablikk.no/" />
    <meta property="og:image" content="https://oyablikk.no/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
